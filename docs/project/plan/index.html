<meta charset="utf-8">
<title>Ayoreni Plan Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a route line of 33 phases grouped by stage; click a stop to drill into its tasks and subtasks. */
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --surface-2: #e9eff3;
  --ink: #12232e;
  --ink-2: #4a5d6b;
  --line: #d3dde4;
  --accent: #0b6f78;
  --accent-ink: #ffffff;
  --done: #1f7a4d;
  --done-bg: #dff1e7;
  --active: #0a5fb4;
  --active-bg: #dceafa;
  --waiting: #9a5b00;
  --waiting-bg: #fbecd2;
  --blocked: #b3261e;
  --blocked-bg: #fadedc;
  --todo: #56656f;
  --todo-bg: #e7ecef;
  --later: #7d8a93;
  --later-bg: transparent;
  --display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d171d; --surface: #14222b; --surface-2: #1b2c36; --ink: #e6eef2; --ink-2: #9fb2bf; --line: #2a3d48;
  --accent: #4cc3c9; --accent-ink: #062126;
  --done: #6fd39c; --done-bg: #163527; --active: #7fb8ff; --active-bg: #152b45;
  --waiting: #f2b860; --waiting-bg: #3a2a10; --blocked: #ff8f86; --blocked-bg: #3d1a18;
  --todo: #a9b7c0; --todo-bg: #22333d; --later: #7f929e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d171d; --surface: #14222b; --surface-2: #1b2c36; --ink: #e6eef2; --ink-2: #9fb2bf; --line: #2a3d48;
  --accent: #4cc3c9; --accent-ink: #062126;
  --done: #6fd39c; --done-bg: #163527; --active: #7fb8ff; --active-bg: #152b45;
  --waiting: #f2b860; --waiting-bg: #3a2a10; --blocked: #ff8f86; --blocked-bg: #3d1a18;
  --todo: #a9b7c0; --todo-bg: #22333d; --later: #7f929e; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 28px }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2 }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.01em }
h2 { font-size: 19px; font-weight: 700 }
h3 { font-size: 16px; font-weight: 700 }
p { margin: 0 }
a { color: var(--accent) }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px }
.muted { color: var(--ink-2) }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2) }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between }
.brand { display: flex; gap: 12px; align-items: center }
.mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none }
.legend { display: flex; flex-wrap: wrap; gap: 6px }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.s-done { color: var(--done); background: var(--done-bg) }
.s-active { color: var(--active); background: var(--active-bg) }
.s-waiting { color: var(--waiting); background: var(--waiting-bg) }
.s-blocked { color: var(--blocked); background: var(--blocked-bg) }
.s-todo { color: var(--todo); background: var(--todo-bg) }
.s-later { color: var(--later); border-color: var(--line); background: transparent }
.who { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap }

.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px }
.crumbs a { text-decoration: none; font-weight: 600 }
.crumbs span.sep { color: var(--ink-2) }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0 }
.now-head { font-size: 18px; font-weight: 600; font-family: var(--display) }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)) }
.sess { display: grid; gap: 10px; align-content: start }
.sess-row { display: grid; grid-template-columns: 84px 1fr; gap: 10px; align-items: start }
.sess-row .where { font-size: 13px }
.list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none }
.list li { min-width: 0 }
.rowbtn { width: 100%; text-align: left; background: none; border: 0; padding: 8px 6px; border-radius: 8px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; justify-content: space-between }
.rowbtn:hover { background: var(--surface-2) }
.rowbtn .ph { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap }

/* Route map */
.route { display: grid; gap: 22px }
.stage { display: grid; gap: 10px }
.stage-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline }
.stage-head .letter { font-family: var(--mono); font-weight: 600; color: var(--accent) }
.stops { position: relative; display: flex; flex-wrap: wrap; gap: 10px }
.stop { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; width: 196px; min-height: 112px; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; text-align: left; cursor: pointer; transition: border-color .15s, transform .15s }
.stop:hover { border-color: var(--accent); transform: translateY(-1px) }
.stop.is-later { background: transparent; border-style: dashed }
.stop.is-current { border: 2px solid var(--active); padding: 11px }
.stop .num { font-family: var(--mono); font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; color: var(--ink-2) }
.stop .nm { font-weight: 700; font-size: 14px; line-height: 1.3 }
.bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--done); border-radius: 999px }
.stop .foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px }
.risk { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2) }
.risk.High { color: var(--blocked) }
@media (max-width: 520px) { .stop { width: 100%; min-height: 0 } }

/* Phase view */
.ph-top { display: grid; gap: 10px }
.ph-title { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center }
.ph-id { font-family: var(--mono); font-weight: 600; font-size: 15px; background: var(--surface-2); padding: 2px 8px; border-radius: 6px }
.stats { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 14px }
.bigbar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex }
.bigbar > i { display: block; height: 100% }
.filters { display: flex; flex-wrap: wrap; gap: 6px }
.fbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; cursor: pointer }
.fbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.tasks { display: grid; gap: 8px }
.task { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0 }
.task > button { width: 100%; background: none; border: 0; text-align: left; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: start }
.task .tn { font-family: var(--mono); font-weight: 600; color: var(--ink-2); padding-top: 1px }
.task .tt { font-weight: 600; min-width: 0 }
.task .meta { display: flex; flex-wrap: wrap; gap: 6px; justify-content: end; align-items: center }
.task .sub-count { font-size: 12px; color: var(--ink-2); font-family: var(--mono) }
.task .body { padding: 0 14px 14px 58px; display: grid; gap: 10px; font-size: 14px }
.task .body dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px }
.task .body dt { color: var(--ink-2); font-weight: 600 }
.task .body dd { margin: 0; min-width: 0 }
.subs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
.subs li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start }
.tick { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 800; margin-top: 2px }
.tick.done { background: var(--done); border-color: var(--done); color: var(--surface) }
.tick.active { border-color: var(--active) }
.tick.waiting { border-color: var(--waiting) }
.chev { transition: transform .15s; display: inline-block; color: var(--ink-2) }
.task[data-open="true"] .chev { transform: rotate(90deg) }
.scope { margin: 0; padding-left: 20px; display: grid; gap: 6px }
.dec { display: grid; gap: 4px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2) }
.dec .dq { font-weight: 700 }
.decgrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)) }
.navrow { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }
.navbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px }
.navbtn:disabled { opacity: .4; cursor: default }
.empty { padding: 24px; text-align: center; color: var(--ink-2) }
.how { font-size: 14px; display: grid; gap: 6px }
.how code { font-family: var(--mono); font-size: 13px; background: var(--surface-2); padding: 1px 5px; border-radius: 5px }
@media (max-width: 560px) {
  .task > button { grid-template-columns: 28px 1fr; }
  .task .meta { grid-column: 2; justify-content: start }
  .task .body { padding-left: 14px }
  .sess-row { grid-template-columns: 1fr; gap: 2px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">A</div>
      <div>
        <h1>Ayoreni Plan Map</h1>
        <p class="muted" id="updated">Loading the plan…</p>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </header>
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <main id="view" class="wrap" style="gap:24px"><div class="panel empty">Loading the plan…</div></main>
</div>

<script>
(function () {
  const ORDER = ["done", "active", "waiting", "blocked", "todo"];
  const LABEL = { done: "Done", active: "In progress", waiting: "Waiting", blocked: "Blocked", todo: "Not started", later: "Not briefed yet" };
  const WHO = ["UI", "Backend", "Owner", "Designer", "Lead"];
  const DOCS = "https://github.com/jai38/ayoreni-docs/blob/main/";
  let plan = null, phases = [], filter = "All";

  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const chip = s => `<span class="chip s-${s}">${LABEL[s] || s}</span>`;
  const hashId = id => "phase-" + String(id).toLowerCase();

  function progress(p) {
    const t = p.tasks || [];
    const c = { done: 0, active: 0, waiting: 0, blocked: 0, todo: 0 };
    t.forEach(x => { c[x.status] = (c[x.status] || 0) + 1; });
    return { total: t.length, c, pct: t.length ? Math.round(100 * c.done / t.length) : 0 };
  }

  function legend() {
    document.getElementById("legend").innerHTML = ORDER.concat("later").map(chip).join("");
  }

  function crumbs(parts) {
    const el = document.getElementById("crumbs");
    el.innerHTML = parts.map((p, i) => i < parts.length - 1
      ? `<a href="#${p.h}">${esc(p.t)}</a><span class="sep" aria-hidden="true">›</span>`
      : `<span aria-current="page">${esc(p.t)}</span>`).join("");
  }

  function stopCard(p) {
    const pr = progress(p);
    const cur = plan.now.current === p.id;
    const later = p.status === "later";
    const bottom = later ? `<span class="muted">Scope only</span>` : `<span class="mono">${pr.c.done}/${pr.total}</span>`;
    return `<button class="stop${later ? " is-later" : ""}${cur ? " is-current" : ""}" data-go="${hashId(p.id)}" aria-label="Phase ${esc(p.id)}: ${esc(p.name)}, ${LABEL[p.status]}">
      <span class="num"><span>${p.id === "V1" ? "Gate" : "Phase " + esc(p.id)}</span><span class="risk ${esc(p.risk)}">${esc(p.risk)} risk</span></span>
      <span class="nm">${esc(p.name)}</span>
      <span style="display:grid;gap:6px">
        ${later ? "" : `<span class="bar"><i style="width:${pr.pct}%"></i></span>`}
        <span class="foot">${chip(p.status)}${bottom}</span>
      </span>
    </button>`;
  }

  function home() {
    crumbs([{ t: "Whole plan", h: "home" }]);
    const n = plan.now;
    const open = plan.decisions.filter(d => d.status === "open");
    const sess = n.sessions.map(s => `<div class="sess-row"><span><a class="who" href="#who-${s.who.toLowerCase()}">${esc(s.who)}</a></span><div><div>${esc(s.doing)}</div><div class="where muted">${esc(s.where)}</div></div></div>`).join("");
    const wait = n.waitingOnOwner.map(w => `<li><button class="rowbtn" data-go="${hashId(w.phase)}"><span>${esc(w.item)}${w.note ? `<span class="muted"> · ${esc(w.note)}</span>` : ""}</span><span class="ph">Phase ${esc(w.phase)}</span></button></li>`).join("");
    const dec = open.map(d => `<li><button class="rowbtn" data-go="${hashId(d.phase)}"><span><b class="mono">${esc(d.id)}</b> ${esc(d.q)}</span><span class="ph">Phase ${esc(d.phase)}</span></button></li>`).join("");
    const stages = plan.stages.map(s => `<section class="stage" aria-label="Stage ${esc(s.id)}">
        <div class="stage-head"><span class="letter">${s.id === "V1" ? "◆" : "Stage " + esc(s.id)}</span><h3>${esc(s.name)}</h3><span class="muted" style="font-size:14px">${esc(s.summary)}</span></div>
        <div class="stops">${s.phases.map(stopCard).join("")}</div>
      </section>`).join("");
    const done = phases.filter(p => p.status === "done").length;
    document.getElementById("view").innerHTML = `
      <section class="panel" aria-label="Right now">
        <div class="eyebrow">Right now</div>
        <p class="now-head">${esc(n.headline)}</p>
        <div class="grid2">
          <div class="sess"><h3>What each session does next</h3>${sess}</div>
          <div class="sess"><h3>Waiting on the owner <span class="muted mono" style="font-weight:500">(${n.waitingOnOwner.length})</span></h3><ul class="list">${wait}</ul></div>
        </div>
        ${open.length ? `<div class="sess"><h3>Open decisions <span class="muted mono" style="font-weight:500">(${open.length})</span></h3><ul class="list">${dec}</ul></div>` : ""}
      </section>
      <section class="route" aria-label="All phases">
        <div class="navrow" style="align-items:baseline"><h2>All phases</h2><span class="muted">${done} of ${phases.length} done · tap a phase to see its tasks</span></div>
        ${stages}
      </section>
      <section class="panel how" aria-label="How this map is kept current">
        <h3>How this map stays current</h3>
        <p>The data lives in <code>docs/project/plan/plan.json</code> in <code>jai38/ayoreni-docs</code>. Each session updates the status of its own tasks there when it updates <code>STATUS.md</code>, and the lead session republishes this page.</p>
        <p class="muted">Briefs in <code>docs/phases/</code> stay the full source. This map is the summary you can click through.</p>
      </section>`;
  }

  function taskHtml(t, open) {
    const subs = t.sub || [];
    const sd = subs.filter(x => x.s === "done").length;
    const rows = [];
    if (t.done) rows.push(`<dt>Done when</dt><dd>${esc(t.done)}</dd>`);
    if (t.model) rows.push(`<dt>Model</dt><dd>${esc(t.model)}</dd>`);
    if (t.notes) rows.push(`<dt>Note</dt><dd>${esc(t.notes)}</dd>`);
    const hasBody = rows.length || subs.length;
    const body = hasBody ? `<div class="body" ${open ? "" : "hidden"}>
        ${rows.length ? `<dl>${rows.join("")}</dl>` : ""}
        ${subs.length ? `<ul class="subs">${subs.map(s => `<li><span class="tick ${s.s}" aria-label="${LABEL[s.s]}">${s.s === "done" ? "✓" : ""}</span><span>${esc(s.t)} ${s.s !== "todo" && s.s !== "done" ? chip(s.s) : ""}</span></li>`).join("")}</ul>` : ""}
      </div>` : "";
    return `<div class="task" data-open="${open ? "true" : "false"}">
      <button ${hasBody ? `aria-expanded="${open}" data-toggle` : "disabled style=\"cursor:default\""}>
        <span class="tn">${esc(t.n)}</span>
        <span class="tt">${hasBody ? '<span class="chev" aria-hidden="true">›</span> ' : ""}${esc(t.title)}</span>
        <span class="meta">${subs.length ? `<span class="sub-count">${sd}/${subs.length}</span>` : ""}<span class="who">${esc(t.who)}</span>${chip(t.status)}</span>
      </button>${body}
    </div>`;
  }

  function phaseView(p) {
    const stage = plan.stages.find(s => s.phases.includes(p));
    crumbs([{ t: "Whole plan", h: "home" }, { t: stage.id === "V1" ? stage.name : "Stage " + stage.id + ": " + stage.name, h: "home" }, { t: p.id === "V1" ? p.name : "Phase " + p.id }]);
    const pr = progress(p);
    const idx = phases.indexOf(p);
    const prev = phases[idx - 1], next = phases[idx + 1];
    const decs = plan.decisions.filter(d => d.phase === p.id);
    const tasks = (p.tasks || []).filter(t => filter === "All" || t.who === filter);
    const whoHere = WHO.filter(w => (p.tasks || []).some(t => t.who === w));
    const seg = ORDER.map(s => pr.c[s] ? `<i class="s-${s}" style="width:${100 * pr.c[s] / pr.total}%;background:currentColor" title="${LABEL[s]}: ${pr.c[s]}"></i>` : "").join("");
    let html = `<section class="ph-top panel">
        <div class="ph-title"><span class="ph-id">${p.id === "V1" ? "Gate" : "Phase " + esc(p.id)}</span><h2>${esc(p.name)}</h2>${chip(p.status)}<span class="risk ${esc(p.risk)}">${esc(p.risk)} risk</span></div>
        <p style="font-size:16px">${esc(p.goal)}</p>
        ${p.note ? `<p class="muted">${esc(p.note)}</p>` : ""}
        ${pr.total ? `<div class="bigbar" aria-hidden="true">${seg}</div>
          <div class="stats">${ORDER.filter(s => pr.c[s]).map(s => `<span>${chip(s)} <span class="mono">${pr.c[s]}</span></span>`).join("")}<span class="muted">${pr.total} tasks</span></div>` : ""}
        ${p.order ? `<p><b>Order:</b> ${esc(p.order)}</p>` : ""}
        ${p.brief ? `<p><a href="${DOCS + p.brief}" target="_blank" rel="noopener">Open the full brief</a> <span class="muted mono" style="font-size:12px">${esc(p.brief)}</span></p>` : ""}
      </section>`;
    if (decs.length) html += `<section class="panel"><h3>Decisions for this phase</h3><div class="decgrid">${decs.map(d => `<div class="dec"><div class="dq"><span class="mono">${esc(d.id)}</span> ${esc(d.q)} ${d.status === "open" ? chip("waiting") : chip("done")}</div><div>${d.status === "open" ? "<b>Recommended:</b> " : ""}${esc(d.rec)}</div></div>`).join("")}</div></section>`;
    if (p.tasks) {
      html += `<section class="panel"><div class="navrow" style="align-items:center"><h3>Tasks</h3>
        <div class="filters" role="group" aria-label="Show tasks for">${["All"].concat(whoHere).map(w => `<button class="fbtn" data-filter="${w}" aria-pressed="${filter === w}">${w}</button>`).join("")}</div></div>
        <div class="tasks">${tasks.length ? tasks.map(t => taskHtml(t, false)).join("") : `<div class="empty">No ${esc(filter)} tasks in this phase.</div>`}</div>
        <p class="muted" style="font-size:13px">Tap a task to see what "done" means and its subtasks.</p></section>`;
    } else if (p.scope) {
      html += `<section class="panel"><h3>What this phase covers</h3><p class="muted">Not briefed yet. Tasks and subtasks are written when the phase comes up; this is the scope from the roadmap.</p><ul class="scope">${p.scope.map(s => `<li>${esc(s)}</li>`).join("")}</ul></section>`;
    }
    html += `<div class="navrow">
      <button class="navbtn" ${prev ? `data-go="${hashId(prev.id)}"` : "disabled"}>‹ ${prev ? (prev.id === "V1" ? "V1 gate" : "Phase " + esc(prev.id)) : "Start"}</button>
      <button class="navbtn" ${next ? `data-go="${hashId(next.id)}"` : "disabled"}>${next ? (next.id === "V1" ? "V1 gate" : "Phase " + esc(next.id)) : "End"} ›</button></div>`;
    document.getElementById("view").innerHTML = html;
  }

  function whoView(w) {
    crumbs([{ t: "Whole plan", h: "home" }, { t: "Open tasks for " + w }]);
    const groups = phases.map(p => ({ p, ts: (p.tasks || []).filter(t => t.who === w && t.status !== "done") })).filter(g => g.ts.length);
    const filters = `<div class="filters" role="group" aria-label="Show open tasks for">${WHO.map(x => `<button class="fbtn" data-go="who-${x.toLowerCase()}" aria-pressed="${x === w}">${x}</button>`).join("")}</div>`;
    document.getElementById("view").innerHTML = `<section class="panel"><div class="navrow" style="align-items:center"><h2>Open tasks for ${esc(w)}</h2>${filters}</div>
      ${groups.length ? groups.map(g => `<div style="display:grid;gap:8px"><button class="rowbtn" data-go="${hashId(g.p.id)}" style="padding-inline:0"><h3>Phase ${esc(g.p.id)}: ${esc(g.p.name)}</h3><span class="ph">Open phase ›</span></button><div class="tasks">${g.ts.map(t => taskHtml(t, false)).join("")}</div></div>`).join("") : `<div class="empty">Nothing open for ${esc(w)} in the briefed phases.</div>`}
    </section>`;
  }

  function route() {
    const h = (location.hash || "").replace(/^#/, "").toLowerCase();
    if (h.startsWith("phase-")) {
      const p = phases.find(x => hashId(x.id) === h);
      if (p) { phaseView(p); window.scrollTo(0, 0); return; }
    }
    if (h.startsWith("who-")) {
      const w = WHO.find(x => "who-" + x.toLowerCase() === h);
      if (w) { whoView(w); window.scrollTo(0, 0); return; }
    }
    home();
  }

  document.addEventListener("click", e => {
    const go = e.target.closest("[data-go]");
    if (go) { const h = go.getAttribute("data-go"); if (("#" + h) === location.hash) route(); else location.hash = h; return; }
    const f = e.target.closest("[data-filter]");
    if (f) { filter = f.getAttribute("data-filter"); route(); return; }
    const tg = e.target.closest("[data-toggle]");
    if (tg) {
      const task = tg.parentElement, body = task.querySelector(".body");
      const open = task.getAttribute("data-open") !== "true";
      task.setAttribute("data-open", String(open)); tg.setAttribute("aria-expanded", String(open));
      if (body) body.hidden = !open;
    }
  });
  window.addEventListener("hashchange", () => { filter = "All"; route(); });

  legend();
  fetch("plan.json", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
    plan = data;
    plan.stages.forEach(s => s.phases.forEach(p => phases.push(p)));
    document.getElementById("updated").textContent = `33 phases, plus 4b and the V1 gate · updated ${new Date(plan.updated + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })} by the ${plan.updatedBy.toLowerCase()}`;
    route();
  }).catch(() => {
    document.getElementById("view").innerHTML = `<div class="panel empty">The plan data didn't load. Reload the page; if it still fails, ask the lead session to republish it.</div>`;
  });
})();
</script>
